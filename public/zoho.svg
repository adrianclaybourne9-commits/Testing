<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#fff">
    <!-- Red Z -->
    <rect x="0" y="10" width="40" height="40" rx="8" fill="#e23d38"/>
    <text x="20" y="40" text-anchor="middle">Z</text>
    
    <!-- Green o -->
    <rect x="45" y="10" width="40" height="40" rx="8" fill="#46a84d"/>
    <text x="65" y="40" text-anchor="middle">o</text>
    
    <!-- Yellow h -->
    <rect x="90" y="10" width="40" height="40" rx="8" fill="#f0aa1d"/>
    <text x="110" y="40" text-anchor="middle">h</text>
    
    <!-- Blue o -->
    <rect x="135" y="10" width="40" height="40" rx="8" fill="#218ce2"/>
    <text x="155" y="40" text-anchor="middle">o</text>
  </g>
</svg>
